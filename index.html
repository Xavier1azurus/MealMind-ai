<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">

    <!-- OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="homeScreen" class="screen">

    <div class="home-container">

        <div class="logo">
            🍽️
        </div>

        <h1>MealMind</h1>

        <p class="subtitle">
            Your recipes. Your cookbook.
        </p>

        <button class="big-button" id="makeCookbookBtn">
            📖 Make Cookbook
        </button>

        <button class="big-button" id="joinCookbookBtn">
            🔑 Join Cookbook
        </button>

        <button class="big-button secondary" id="publicBooksBtn">
            🌎 Public Cookbooks
        </button>

    </div>

</section>


<!-- ================= MAKE BOOK ================= -->

<section id="makeScreen" class="screen hidden">

    <div class="page">

        <button class="back-button" id="makeBackBtn">
            ← Back
        </button>

        <h1>Make Cookbook</h1>

        <input
            id="cookbookName"
            class="input"
            placeholder="Cookbook name"
        >

        <input
            id="cookbookPassword"
            class="input"
            type="password"
            placeholder="Create cookbook code"
        >

        <label class="check-row">
            <input type="checkbox" id="showPassword">
            Show code
        </label>

        <select id="cookbookPrivacy" class="input">
            <option value="private">🔒 Private</option>
            <option value="public">🌎 Public</option>
        </select>

        <button class="big-button" id="createCookbookBtn">
            Create Cookbook
        </button>

    </div>

</section>


<!-- ================= JOIN ================= -->

<section id="joinScreen" class="screen hidden">

    <div class="page">

        <button class="back-button" id="joinBackBtn">
            ← Back
        </button>

        <h1>Join Cookbook</h1>

        <input
            id="joinName"
            class="input"
            placeholder="Cookbook name"
        >

        <input
            id="joinPassword"
            class="input"
            type="password"
            placeholder="Cookbook code"
        >

        <label class="check-row">
            <input type="checkbox" id="joinShowPassword">
            Show code
        </label>

        <button class="big-button" id="joinBtn">
            Join Cookbook
        </button>

    </div>

</section>


<!-- ================= PUBLIC ================= -->

<section id="publicScreen" class="screen hidden">

    <div class="page">

        <button class="back-button" id="publicBackBtn">
            ← Back
        </button>

        <h1>Public Cookbooks</h1>

        <div id="publicBooksList"></div>

    </div>

</section>


<!-- ================= MAIN BOOK ================= -->

<section id="mainScreen" class="screen hidden">

    <header class="topbar">

        <button id="exitBookBtn" class="icon-button">
            ←
        </button>

        <div>
            <h2 id="mainBookName">Cookbook</h2>
        </div>

        <button id="scanBtn" class="scan-button">
            📷 Scan
        </button>

    </header>


    <main class="book-content">

        <div class="search-row">

            <input
                id="searchInput"
                class="search-input"
                placeholder="Search recipes..."
            >

        </div>


        <div class="section-title-row">

            <h2>Folders</h2>

            <button id="addFolderBtn" class="small-button">
                + Folder
            </button>

        </div>

        <div id="folders" class="folders"></div>


        <div class="section-title-row">

            <h2 id="recipeListTitle">
                Recipes
            </h2>

            <button id="clearFolderBtn" class="small-button hidden">
                All
            </button>

        </div>

        <div id="recipes" class="recipes"></div>

    </main>

</section>


<!-- ================= SCANNER ================= -->

<input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
>


<div id="scannerOverlay" class="scanner-overlay hidden">

    <div class="scanner-box">

        <div class="scanner-icon">
            📷
        </div>

        <h2>Scanning Recipe</h2>

        <p id="scannerStatus">
            Preparing scanner...
        </p>

        <div class="progress-background">
            <div id="scannerProgress"
                 class="progress">
            </div>
        </div>

        <button id="cancelScanBtn"
                class="secondary-button">
            Cancel
        </button>

    </div>

</div>


<!-- ================= RECIPE VIEWER ================= -->

<section id="recipeScreen" class="screen hidden">

    <div class="recipe-page">

        <header class="recipe-top">

            <button id="recipeBackBtn"
                    class="back-button">
                ← Back
            </button>

            <div class="recipe-actions">

                <button id="editRecipeBtn"
                        class="small-button">
                    ✏️
                </button>

                <button id="deleteRecipeBtn"
                        class="small-button danger">
                    🗑️
                </button>

            </div>

        </header>


        <article class="recipe-card-large">

            <div class="recipe-label">
                MEALMIND RECIPE
            </div>

            <h1 id="recipeTitle">
                Recipe
            </h1>

            <p id="recipeCuisine"
               class="recipe-cuisine">
            </p>


            <div class="recipe-info">

                <span>🍽️ Serves</span>

                <button id="servingMinus">
                    −
                </button>

                <strong id="servingNumber">
                    4
                </strong>

                <button id="servingPlus">
                    +
                </button>

            </div>


            <hr>


            <section>

                <h2>Ingredients</h2>

                <ul id="ingredientList">
                </ul>

            </section>


            <section>

                <h2>Instructions</h2>

                <ol id="instructionList">
                </ol>

            </section>


            <section id="notesSection" class="hidden">

                <h2>Notes</h2>

                <p id="recipeNotes"></p>

            </section>


            <div id="recipePages"
                 class="recipe-pages">
            </div>

        </article>

    </div>

</section>


<!-- ================= EDIT ================= -->

<div id="editModal"
     class="modal hidden">

    <div class="modal-card">

        <h2>Edit Recipe</h2>

        <label>Title</label>

        <input id="editTitle"
               class="input">

        <label>Cuisine</label>

        <input id="editCuisine"
               class="input">

        <label>Servings</label>

        <input id="editServings"
               class="input"
               type="number"
               min="1">

        <label>Ingredients</label>

        <textarea id="editIngredients"
                  class="textarea"
                  placeholder="One ingredient per line"></textarea>

        <label>Instructions</label>

        <textarea id="editInstructions"
                  class="textarea"
                  placeholder="One instruction per line"></textarea>

        <label>Notes</label>

        <textarea id="editNotes"
                  class="textarea"></textarea>

        <div class="modal-buttons">

            <button id="saveEditBtn"
                    class="big-button">
                Save
            </button>

            <button id="cancelEditBtn"
                    class="secondary-button">
                Cancel
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
