<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">

    <!-- OCR scanner -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<div id="app">

    <!-- HOME -->
    <section id="homeScreen" class="screen">

        <div class="logo">🍽️</div>

        <h1>MealMind</h1>
        <p class="subtitle">Your digital cookbook</p>

        <div class="home-buttons">

            <button data-action="make-cookbook">
                📖 Make a Cookbook
            </button>

            <button data-action="join-cookbook">
                🔐 Join a Cookbook
            </button>

            <button data-action="public-books">
                🌎 Public Cookbooks
            </button>

        </div>

        <p class="creator">
            Made by Narayan Xavier Gill
        </p>

    </section>


    <!-- CREATE COOKBOOK -->
    <section id="makeScreen" class="screen hidden">

        <div class="card">

            <button class="back" data-action="home">← Back</button>

            <h1>Create Cookbook</h1>

            <input
                id="cookbookName"
                type="text"
                placeholder="Cookbook name"
            >

            <input
                id="cookbookPassword"
                type="password"
                placeholder="Create a code"
            >

            <label class="check-row">
                <input
                    id="showCreatePassword"
                    type="checkbox"
                >
                Show code
            </label>

            <select id="cookbookPrivacy">
                <option value="private">🔒 Private</option>
                <option value="public">🌎 Public</option>
            </select>

            <button
                class="primary"
                data-action="create-cookbook"
            >
                Create Cookbook
            </button>

        </div>

    </section>


    <!-- JOIN -->
    <section id="joinScreen" class="screen hidden">

        <div class="card">

            <button class="back" data-action="home">← Back</button>

            <h1>Join Cookbook</h1>

            <input
                id="joinName"
                type="text"
                placeholder="Cookbook name"
            >

            <input
                id="joinPassword"
                type="password"
                placeholder="Cookbook code"
            >

            <label class="check-row">
                <input
                    id="showJoinPassword"
                    type="checkbox"
                >
                Show code
            </label>

            <button
                class="primary"
                data-action="join"
            >
                Join Cookbook
            </button>

        </div>

    </section>


    <!-- PUBLIC -->
    <section id="publicScreen" class="screen hidden">

        <div class="card">

            <button class="back" data-action="home">← Back</button>

            <h1>Public Cookbooks</h1>

            <div id="publicBooksList"></div>

        </div>

    </section>


    <!-- MAIN COOKBOOK -->
    <section id="mainScreen" class="screen hidden">

        <header class="topbar">

            <button data-action="home">←</button>

            <h2 id="mainBookName">Cookbook</h2>

            <button data-action="exit-book">✕</button>

        </header>


        <main class="book-content">

            <button
                class="scan-button"
                data-action="scan"
            >
                📷 Scan Recipe
            </button>

            <input
                id="cameraInput"
                type="file"
                accept="image/*"
                capture="environment"
                hidden
            >


            <input
                id="searchInput"
                class="search"
                type="search"
                placeholder="🔎 Search recipes..."
            >


            <div class="section-title-row">

                <h2>Folders</h2>

                <button
                    class="small-button"
                    data-action="add-folder"
                >
                    + Folder
                </button>

            </div>

            <div id="folders"></div>


            <div class="section-title-row">

                <h2>Recipes</h2>

                <button
                    class="small-button"
                    data-action="clear-folder"
                >
                    All
                </button>

            </div>

            <div id="recipes"></div>

        </main>

    </section>


    <!-- RECIPE VIEWER IS CREATED BY JAVASCRIPT -->


    <!-- EDITOR IS CREATED BY JAVASCRIPT -->

</div>


<script src="script.js"></script>

</body>
</html>
