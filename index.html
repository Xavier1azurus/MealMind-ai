<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

    <main class="app">

        <h1>🧠 MealMind</h1>

        <p>Scan your recipes. Plan your meals.</p>

        <input
            type="file"
            id="recipeImage"
            accept="image/*"
            capture="environment"
            hidden
        >

        <button id="scanButton">
            📸 Scan Recipe
        </button>

        <p id="status"></p>

        <section id="scanResult">

            <h2>📖 Scanned Recipe</h2>

            <textarea
                id="recipeText"
                placeholder="Your scanned recipe will appear here..."
            ></textarea>

        </section>

        <section>

            <h2>🛒 Grocery List</h2>

            <ul id="groceryList"></ul>

        </section>

    </main>


    <!-- Hidden owner login -->

    <div id="ownerLogin" class="owner-login" hidden>

        <h2>🔐 Owner Login</h2>

        <input
            type="password"
            id="ownerCode"
            placeholder="Owner code"
        >

        <button id="ownerButton">
            Login
        </button>

        <p id="ownerStatus"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
