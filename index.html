<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ================= HOME ================= -->

    <section id="homeScreen" class="screen">

        <div class="home-container">

            <div class="logo">
                🍽️
            </div>

            <h1>MealMind</h1>

            <p class="subtitle">
                Your personal cookbook
            </p>

            <div class="home-buttons">

                <button
                    class="main-button"
                    data-action="make-cookbook">
                    📖 Make a Cookbook
                </button>

                <button
                    class="main-button"
                    data-action="join-cookbook">
                    🔑 Join a Cookbook
                </button>

                <button
                    class="main-button"
                    data-action="public-books">
                    🌎 Public Cookbooks
                </button>

            </div>

        </div>

    </section>


    <!-- ================= MAKE COOKBOOK ================= -->

    <section id="makeScreen" class="screen hidden">

        <div class="page-container">

            <button
                class="back-button"
                data-action="home">
                ← Back
            </button>

            <h1>Create Cookbook</h1>

            <p class="page-description">
                Create your own private cookbook.
            </p>

            <label>
                Cookbook name
            </label>

            <input
                id="cookbookName"
                class="text-input"
                type="text"
                placeholder="My Cookbook">

            <label>
                Cookbook code
            </label>

            <input
                id="cookbookPassword"
                class="text-input"
                type="password"
                placeholder="At least 4 characters">

            <label class="checkbox-row">
                <input
                    id="showCreatePassword"
                    type="checkbox">
                Show code
            </label>

            <label>
                Privacy
            </label>

            <select
                id="cookbookPrivacy"
                class="text-input">

                <option value="private">
                    Private
                </option>

                <option value="public">
                    Public
                </option>

            </select>

            <button
                class="main-button"
                data-action="create-cookbook">
                Create Cookbook
            </button>

        </div>

    </section>


    <!-- ================= JOIN ================= -->

    <section id="joinScreen" class="screen hidden">

        <div class="page-container">

            <button
                class="back-button"
                data-action="home">
                ← Back
            </button>

            <h1>Join Cookbook</h1>

            <label>
                Cookbook name
            </label>

            <input
                id="joinName"
                class="text-input"
                type="text"
                placeholder="Cookbook name">

            <label>
                Cookbook code
            </label>

            <input
                id="joinPassword"
                class="text-input"
                type="password"
                placeholder="Cookbook code">

            <label class="checkbox-row">
                <input
                    id="showJoinPassword"
                    type="checkbox">
                Show code
            </label>

            <button
                class="main-button"
                data-action="join">
                Join Cookbook
            </button>

        </div>

    </section>


    <!-- ================= PUBLIC ================= -->

    <section id="publicScreen" class="screen hidden">

        <div class="page-container">

            <button
                class="back-button"
                data-action="home">
                ← Back
            </button>

            <h1>Public Cookbooks</h1>

            <div id="publicBooksList"></div>

        </div>

    </section>


    <!-- ================= MAIN COOKBOOK ================= -->

    <section id="mainScreen" class="screen hidden">

        <header class="book-header">

            <button
                class="header-button"
                data-action="home">
                ←
            </button>

            <div class="book-title-area">

                <h1 id="mainBookName">
                    Cookbook
                </h1>

            </div>

            <button
                class="header-button"
                data-action="exit-book">
                ✕
            </button>

        </header>


        <main class="main-content">

            <!-- SEARCH -->

            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="🔍 Search recipes">


            <!-- SCANNER -->

            <button
                class="scan-button"
                data-action="scan">

                📷
                <span>
                    Scan Recipe
                </span>

            </button>

            <input
                id="cameraInput"
                type="file"
                accept="image/*"
                capture="environment"
                multiple
                hidden>


            <!-- FOLDERS -->

            <div class="section-header">

                <h2>
                    Folders
                </h2>

                <button
                    class="small-button"
                    data-action="add-folder">
                    ＋ Folder
                </button>

            </div>

            <div id="folders" class="folders"></div>


            <!-- RECIPES -->

            <div class="section-header">

                <h2>
                    Recipes
                </h2>

            </div>

            <div id="recipes" class="recipes"></div>

        </main>

    </section>


    <!-- ================= SCANNER ================= -->

    <section id="scannerScreen" class="screen hidden">

        <div class="page-container">

            <button
                class="back-button"
                data-action="cancel-scan">
                ← Back
            </button>

            <h1>Scan Recipe</h1>

            <p class="page-description">
                Select 1–5 recipe pages.
            </p>

            <input
                id="scannerInput"
                type="file"
                accept="image/*"
                capture="environment"
                multiple>

            <p id="selectedPages">
                No pages selected.
            </p>

            <button
                class="main-button"
                data-action="start-scan">
                📷 Scan Pages
            </button>

        </div>

    </section>


    <!-- ================= RECIPE VIEWER ================= -->

    <div
        id="recipeViewer"
        class="overlay hidden">
    </div>


    <!-- ================= EDITOR ================= -->

    <div
        id="editorModal"
        class="overlay hidden">
    </div>


    <!-- ================= SCANNER STATUS ================= -->

    <div
        id="scannerStatus"
        class="scanner-status hidden">

        <div class="spinner"></div>

        <h2>
            Reading recipe...
        </h2>

        <p id="scannerProgress">
            Please wait.
        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
