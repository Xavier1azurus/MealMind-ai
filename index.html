<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- HOME -->
    <section id="homeScreen" class="screen">
        <div class="home-card">

            <div class="logo">🍽️</div>

            <h1>MealMind</h1>

            <p class="subtitle">
                Your personal digital cookbook
            </p>

            <div class="home-buttons">

                <button
                    class="primary-button"
                    data-action="make-cookbook"
                >
                    📖 Make a Cookbook
                </button>

                <button
                    class="secondary-button"
                    data-action="join-cookbook"
                >
                    🔐 Join a Cookbook
                </button>

                <button
                    class="secondary-button"
                    data-action="public-books"
                >
                    🌎 Public Cookbooks
                </button>

            </div>

            <p class="creator">
                Made by Narayan Xavier Gill
            </p>

        </div>
    </section>


    <!-- MAKE COOKBOOK -->
    <section id="makeScreen" class="screen hidden">

        <div class="page-card">

            <button
                class="back-button"
                data-action="home"
            >
                ← Back
            </button>

            <h2>Create your cookbook</h2>

            <p class="muted">
                Choose a name and create a private code.
            </p>

            <label>Cookbook name</label>

            <input
                id="cookbookName"
                type="text"
                placeholder="My Cookbook"
                autocomplete="off"
            >

            <label>Cookbook code</label>

            <input
                id="cookbookPassword"
                type="password"
                placeholder="At least 4 characters"
                autocomplete="new-password"
            >

            <button
                class="primary-button large-button"
                data-action="create-cookbook"
            >
                Create Cookbook
            </button>

        </div>

    </section>


    <!-- JOIN -->
    <section id="joinScreen" class="screen hidden">

        <div class="page-card">

            <button
                class="back-button"
                data-action="home"
            >
                ← Back
            </button>

            <h2>Join a cookbook</h2>

            <label>Cookbook name</label>

            <input
                id="joinName"
                type="text"
                placeholder="Cookbook name"
                autocomplete="off"
            >

            <label>Cookbook code</label>

            <input
                id="joinPassword"
                type="password"
                placeholder="Cookbook code"
                autocomplete="off"
            >

            <button
                class="primary-button large-button"
                data-action="join"
            >
                Join Cookbook
            </button>

        </div>

    </section>


    <!-- PUBLIC -->
    <section id="publicScreen" class="screen hidden">

        <div class="page-card">

            <button
                class="back-button"
                data-action="home"
            >
                ← Back
            </button>

            <h2>Public Cookbooks</h2>

            <div id="publicBooksList"></div>

        </div>

    </section>


    <!-- MAIN COOKBOOK -->
    <section id="mainScreen" class="screen hidden">

        <header class="main-header">

            <button
                class="icon-button"
                data-action="exit-book"
            >
                ←
            </button>

            <div class="book-title-area">
                <h1 id="mainBookName">
                    Cookbook
                </h1>

                <span>
                    MealMind
                </span>
            </div>

        </header>


        <main class="main-content">

            <!-- SEARCH -->
            <div class="search-box">

                <span>🔎</span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search recipes..."
                >

            </div>


            <!-- ACTIONS -->
            <div class="main-actions">

                <button
                    class="primary-button"
                    data-action="scan"
                >
                    📷 Scan Recipe
                </button>

                <button
                    class="secondary-button"
                    data-action="add-folder"
                >
                    📁 Create Folder
                </button>

            </div>


            <!-- FOLDERS -->
            <section>

                <div class="section-heading">
                    <h2>Folders</h2>
                </div>

                <div
                    id="folders"
                    class="folders-grid"
                ></div>

            </section>


            <!-- RECIPES -->
            <section>

                <div class="section-heading">

                    <h2 id="recipeSectionTitle">
                        Recipes
                    </h2>

                </div>

                <div
                    id="recipes"
                    class="recipes-list"
                ></div>

            </section>

        </main>

    </section>


    <!-- HIDDEN CAMERA INPUT -->
    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
    >

</div>


<script src="script.js"></script>

</body>
</html>
