<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MealMind</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>

</head>


<body>


<!-- =========================
     MAIN MEALMIND APP
========================= -->

<main class="app">

    <h1>🧠 MealMind</h1>

    <p>
        Scan your recipes. Plan your meals.
    </p>


    <!-- CAMERA INPUT -->

    <input
        type="file"
        id="recipeImage"
        accept="image/*"
        capture="environment"
        hidden
    >


    <!-- SCAN BUTTON -->

    <button id="scanButton">

        📸 Scan Recipe

    </button>


    <p id="status"></p>


    <!-- RECIPE SCANNER BOX -->

    <section>

        <h2>
            📖 Recipe Scanner
        </h2>

        <textarea
            id="recipeText"
            placeholder="Scan a recipe or type recipe text here..."
        ></textarea>


        <button id="saveRecipeButton">

            💾 Save Recipe

        </button>

    </section>


</main>



<!-- =========================
     DOWNLOAD SCREEN
========================= -->

<div
    id="downloadScreen"
    class="download-screen"
    hidden
>

    <div class="download-box">

        <h1>
            🧠 MealMind
        </h1>

        <h2>
            You've reached the free limit.
        </h2>

        <p>
            Download the MealMind app to
            keep scanning recipes.
        </p>


        <button
            id="appStoreButton"
            class="store-button"
        >

             App Store

        </button>


        <button
            id="playStoreButton"
            class="store-button"
        >

            ▶ Google Play

        </button>


        <button
            id="closeDownload"
            class="secondary-button"
        >

            ← Back

        </button>

    </div>

</div>



<!-- =========================
     OWNER LOGIN
========================= -->

<div
    id="ownerLogin"
    class="owner-login"
    hidden
>

    <div class="login-box">

        <h2>
            🔐 Owner Login
        </h2>


        <input
            type="password"
            id="ownerCode"
            placeholder="Owner code"
        >


        <button id="ownerButton">

            Login

        </button>


        <p id="ownerStatus"></p>

    </div>

</div>



<!-- =========================
     OWNER PANEL
========================= -->

<div
    id="ownerPanel"
    class="owner-panel"
    hidden
>

    <div class="owner-app">


        <header class="owner-header">

            <div>

                <h1>
                    🧠 MealMind
                </h1>

                <p>
                    Owner Dashboard
                </p>

            </div>


            <span class="owner-badge">

                OWNER

            </span>

        </header>



        <!-- OWNER SCANNER -->

        <section class="owner-section">

            <h2>
                📸 Owner Scanner
            </h2>


            <input
                type="file"
                id="ownerRecipeImage"
                accept="image/*"
                capture="environment"
                hidden
            >


            <button id="ownerScanButton">

                📸 Scan Recipe

            </button>


            <p id="ownerScanStatus"></p>


        </section>



        <!-- FOLDERS -->

        <section class="owner-section">

            <h2>
                📂 Recipe Folders
            </h2>


            <div class="folders">


                <button
                    class="folder"
                    data-folder="Sweet"
                >

                    <span>🍰</span>

                    Sweet

                </button>


                <button
                    class="folder"
                    data-folder="Savoury"
                >

                    <span>🍽️</span>

                    Savoury

                </button>


                <button
                    class="folder"
                    data-folder="Fried"
                >

                    <span>🍟</span>

                    Fried

                </button>


                <button
                    class="folder"
                    data-folder="International"
                >

                    <span>🌎</span>

                    International

                </button>


            </div>

        </section>



        <!-- SAVED RECIPES -->

        <section class="owner-section">

            <h2 id="folderTitle">

                📖 All Recipes

            </h2>


            <div
                id="savedRecipes"
                class="saved-recipes"
            ></div>

        </section>



        <button
            id="closeOwner"
            class="close-owner"
        >

            ← Back to MealMind

        </button>


    </div>

</div>



<!-- =========================
     RECIPE DETAILS
========================= -->

<div
    id="recipeDetails"
    class="recipe-details"
    hidden
>

    <div class="recipe-details-box">


        <button
            id="closeRecipe"
            class="close-recipe"
        >

            ← Back

        </button>


        <h1 id="detailTitle"></h1>


        <p id="detailCategory"></p>


        <h2>
            🥕 Ingredients
        </h2>


        <ul id="detailIngredients"></ul>


        <h2>
            📖 Recipe
        </h2>


        <div
            id="detailText"
            class="detail-text"
        ></div>


    </div>

</div>



<script src="script.js"></script>


</body>

</html>
