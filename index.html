<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <h1>🧠 MealMind</h1>

        <p>Scan your recipes. Plan your meals.</p>

        <button id="scanButton">
            📸 Scan Recipe
        </button>

        <section>
            <h2>My Recipes</h2>
            <div id="recipes"></div>
        </section>

        <section>
            <h2>🛒 Grocery List</h2>
            <ul id="groceryList"></ul>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
