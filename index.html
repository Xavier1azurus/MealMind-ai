
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f7f5f0">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           MOBILE CENTERING
        ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #f7f5f0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(24px, env(safe-area-inset-top))
                20px
                max(24px, env(safe-area-inset-bottom))
                20px;
        }

        .hidden {
            display: none !important;
        }

        .app-container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
        }

        /* =========================
           HOME
        ========================= */

        .logo {
            font-size: 64px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            margin: 0 0 32px;
            opacity: .65;
            font-size: 16px;
        }

        .button-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .main-button,
        .secondary-button {
            width: 100%;
            min-height: 56px;
            border: none;
            border-radius: 16px;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 16px;
            transition:
                transform .12s ease,
                opacity .12s ease;
        }

        .main-button {
            background: #171717;
            color: white;
        }

        .secondary-button {
            background: #e7e3db;
            color: #171717;
        }

        .main-button:active,
        .secondary-button:active {
            transform: scale(.97);
            opacity: .8;
        }

        .small-button {
            width: auto;
            min-height: 44px;
        }

        .back-button {
            border: none;
            background: transparent;
            font-size: 28px;
            padding: 8px;
        }

        /* =========================
           FORMS
        ========================= */

        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow:
                0 10px 40px rgba(0,0,0,.08);
        }

        .card h1 {
            font-size: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin: 18px 0 7px;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #d8d4cc;
            background: white;
            border-radius: 14px;
            padding: 15px;
            font: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #777;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .card .main-button,
        .card .secondary-button {
            margin-top: 16px;
        }

        /* =========================
           COOKBOOK
        ========================= */

        #mainScreen {
            display: block;
            min-height: 100vh;
            min-height: 100dvh;
            padding-top: 24px;
            padding-bottom: 30px;
        }

        #mainScreen .app-container {
            text-align: left;
        }

        .book-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .book-header h1 {
            font-size: 28px;
            margin: 3px 0;
        }

        .book-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            opacity: .5;
        }

        #privacyBadge {
            font-size: 13px;
            opacity: .6;
        }

        .search-input {
            margin-bottom: 18px;
        }

        /* =========================
           MAIN ACTION BUTTONS
        ========================= */

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .action-grid .main-button {
            min-height: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 15px;
        }

        .action-grid .main-button:first-line {
            font-size: 25px;
        }

        /* =========================
           SECTIONS
        ========================= */

        .content-section {
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 21px;
            margin: 0;
        }

        /* =========================
           FOLDERS
        ========================= */

        .folders-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .folder-card {
            min-height: 70px;
            border: 1px solid #ddd8cf;
            background: white;
            border-radius: 16px;
            padding: 14px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .folder-card strong {
            font-size: 16px;
        }

        .folder-card small {
            opacity: .55;
            margin-left: auto;
        }

        .folder-icon {
            font-size: 28px;
        }

        /* =========================
           RECIPES
        ========================= */

        .recipes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recipe-card {
            width: 100%;
            min-height: 76px;
            border: 1px solid #ddd8cf;
            background: white;
            border-radius: 17px;
            padding: 14px;
            text-align: left;

            display: flex;
            align-items: center;
            gap: 13px;
        }

        .recipe-card:active {
            transform: scale(.98);
        }

        .recipe-card-icon {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: #f0ede7;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
            flex-shrink: 0;
        }

        .recipe-card-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .recipe-card-text strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .recipe-card-text span {
            font-size: 13px;
            opacity: .55;
        }

        .recipe-arrow {
            font-size: 26px;
            opacity: .4;
        }

        /* =========================
           RECIPE VIEWER
        ========================= */

        .recipe-viewer {
            position: fixed;
            inset: 0;
            z-index: 10000;
            overflow-y: auto;
            background: #f7f5f0;
        }

        .recipe-viewer-background {
            min-height: 100%;
            padding: 15px;
        }

        .recipe-sheet {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow:
                0 10px 40px rgba(0,0,0,.08);
        }

        .recipe-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .recipe-back-button,
        .recipe-action-button {
            border: none;
            background: #eeeae3;
            border-radius: 12px;
            padding: 10px 13px;
            font-weight: 700;
        }

        .recipe-actions {
            display: flex;
            gap: 7px;
        }

        .recipe-action-button.danger {
            color: #b00020;
        }

        .recipe-header {
            text-align: center;
        }

        .recipe-label {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: .45;
            font-weight: 800;
        }

        .recipe-header h1 {
            margin: 8px 0;
            font-size: 32px;
        }

        .recipe-cuisine {
            opacity: .6;
        }

        .recipe-serving-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .recipe-serving-row button {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #eeeae3;
            font-size: 22px;
        }

        .recipe-line {
            height: 1px;
            background: #e5e1da;
            margin: 25px 0;
        }

        .recipe-section {
            margin-bottom: 28px;
        }

        .recipe-section h2 {
            font-size: 22px;
            margin-bottom: 14px;
        }

        .recipe-ingredients,
        .recipe-instructions {
            padding-left: 23px;
        }

        .recipe-ingredients li,
        .recipe-instructions li {
            margin-bottom: 11px;
            line-height: 1.5;
        }

        .recipe-notes {
            background: #f7f5f0;
            border-radius: 15px;
            padding: 16px;
        }

        .recipe-footer {
            text-align: center;
            opacity: .45;
            font-size: 12px;
            margin-top: 35px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 15000;
            background: rgba(0,0,0,.35);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal.hidden {
            display: none !important;
        }

        .modal-card {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 24px;
            padding: 22px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        /* =========================
           EMPTY STATE / FOOTER
        ========================= */

        .empty-state {
            text-align: center;
            padding: 35px 15px;
            opacity: .6;
        }

        .empty-state div {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .made-by,
        .app-footer {
            text-align: center;
            opacity: .45;
            font-size: 12px;
            margin-top: 35px;
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .screen {
                padding-left: 15px;
                padding-right: 15px;
            }

            h1 {
                font-size: 31px;
            }

            .action-grid {
                grid-template-columns: 1fr;
            }

            .recipe-header h1 {
                font-size: 27px;
            }
        }

        /* =========================
           IPAD
        ========================= */

        @media (min-width: 600px) {

            .screen {
                padding-left: 35px;
                padding-right: 35px;
            }

            .action-grid {
                grid-template-columns: 1fr 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HOME
    ========================== -->

    <main
        id="homeScreen"
        class="screen"
    >

        <div class="app-container">

            <div class="logo">
                🍽️
            </div>

            <h1>
                MealMind
            </h1>

            <p class="subtitle">
                Your recipes. Your cookbook.
            </p>


            <div class="button-stack">

                <button
                    type="button"
                    class="main-button"
                    data-action="make-cookbook"
                >
                    📖 Make a Cookbook
                </button>


                <button
                    type="button"
                    class="main-button"
                    data-action="join-cookbook"
                >
                    🔑 Join a Cookbook
                </button>


                <button
                    type="button"
                    class="main-button"
                    data-action="public-books"
                >
                    🌎 Public Cookbooks
                </button>

            </div>


            <p class="made-by">
                Made by Narayan Xavier Gill
            </p>

        </div>

    </main>



    <!-- =========================
         MAKE COOKBOOK
    ========================== -->

    <main
        id="makeScreen"
        class="screen hidden"
    >

        <div class="card">

            <h1>
                Make Your Cookbook
            </h1>

            <p>
                Create your own cookbook.
            </p>


            <label for="cookbookName">
                Cookbook name
            </label>

            <input
                id="cookbookName"
                type="text"
                placeholder="My Cookbook"
                autocomplete="off"
            >


            <label for="cookbookPassword">
                Cookbook code
            </label>

            <input
                id="cookbookPassword"
                type="password"
                placeholder="Create a code"
                autocomplete="new-password"
            >


            <button
                type="button"
                class="main-button"
                data-action="create-cookbook"
            >
                Create Cookbook
            </button>


            <button
                type="button"
                class="secondary-button"
                data-action="home"
            >
                ← Back
            </button>

        </div>

    </main>



    <!-- =========================
         JOIN COOKBOOK
    ========================== -->

    <main
        id="joinScreen"
        class="screen hidden"
    >

        <div class="card">

            <h1>
                Join a Cookbook
            </h1>

            <p>
                Enter the cookbook name and code.
            </p>


            <label for="joinName">
                Cookbook name
            </label>

            <input
                id="joinName"
                type="text"
                placeholder="Cookbook name"
                autocomplete="off"
            >


            <label for="joinPassword">
                Cookbook code
            </label>

            <input
                id="joinPassword"
                type="password"
                placeholder="Cookbook code"
                autocomplete="off"
            >


            <button
                type="button"
                class="main-button"
                data-action="join"
            >
                Join Cookbook
            </button>


            <button
                type="button"
                class="secondary-button"
                data-action="home"
            >
                ← Back
            </button>

        </div>

    </main>



    <!-- =========================
         PUBLIC COOKBOOKS
    ========================== -->

    <main
        id="publicScreen"
        class="screen hidden"
    >

        <div class="app-container">

            <div class="top-bar">

                <button
                    type="button"
                    class="back-button"
                    data-action="home"
                >
                    ←
                </button>

                <h1>
                    Public Cookbooks
                </h1>

            </div>


            <div id="publicBooksList"></div>

        </div>

    </main>



    <!-- =========================
         MAIN COOKBOOK
    ========================== -->

    <main
        id="mainScreen"
        class="screen hidden"
    >

        <div class="app-container">


            <header class="book-header">

                <div>

                    <span class="book-label">
                        MY COOKBOOK
                    </span>

                    <h1 id="mainBookName">
                        My Cookbook
                    </h1>

                    <span id="privacyBadge">
                        🔒 Private
                    </span>

                </div>


                <button
                    type="button"
                    class="secondary-button small-button"
                    data-action="exit-book"
                >
                    Exit
                </button>

            </header>



            <input
                id="searchInput"
                class="search-input"
                type="search"
                placeholder="🔎 Search recipes..."
                autocomplete="off"
            >



            <div class="action-grid">

                <button
                    type="button"
                    class="main-button"
                    data-action="scan"
                >
                    📷
                    <span>Scan Recipe</span>
                </button>


                <button
                    type="button"
                    class="main-button"
                    data-action="add-folder"
                >
                    📁
                    <span>Add Folder</span>
                </button>

            </div>



            <input
                id="cameraInput"
                type="file"
                accept="image/*"
                capture="environment"
                hidden
            >



            <section class="content-section">

                <div class="section-header">

                    <h2>
                        Folders
                    </h2>

                </div>


                <div
                    id="folders"
                    class="folders-list"
                ></div>

            </section>



            <section class="content-section">

                <div class="section-header">

                    <h2>
                        Recipes
                    </h2>

                </div>


                <div
                    id="recipes"
                    class="recipes-list"
                ></div>

            </section>



            <footer class="app-footer">
                Made by Narayan Xavier Gill
            </footer>

        </div>

    </main>



    <!-- =========================
         EDIT RECIPE MODAL
    ========================== -->

    <div
        id="editorModal"
        class="modal hidden"
    >

        <div class="modal-card">

            <h2>
                Edit Recipe
            </h2>


            <label for="editRecipeTitle">
                Recipe title
            </label>

            <input
                id="editRecipeTitle"
                type="text"
                placeholder="Recipe title"
            >


            <label for="editRecipeCuisine">
                Cuisine
            </label>

            <input
                id="editRecipeCuisine"
                type="text"
                placeholder="Cuisine"
            >


            <label for="editRecipeServings">
                Servings
            </label>

            <input
                id="editRecipeServings"
                type="number"
                min="1"
                value="4"
            >


            <label for="editRecipeIngredients">
                Ingredients
            </label>

            <textarea
                id="editRecipeIngredients"
                placeholder="One ingredient per line"
            ></textarea>


            <label for="editRecipeInstructions">
                Instructions
            </label>

            <textarea
                id="editRecipeInstructions"
                placeholder="One instruction per line"
            ></textarea>


            <label for="editRecipeNotes">
                Notes
            </label>

            <textarea
                id="editRecipeNotes"
                placeholder="Optional notes"
            ></textarea>


            <div class="modal-buttons">

                <button
                    type="button"
                    class="main-button"
                    data-action="save-recipe"
                >
                    Save Recipe
                </button>


                <button
                    type="button"
                    class="secondary-button"
                    data-action="cancel-edit"
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         OCR
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
    ></script>


    <!-- =========================
         MEALMIND SCRIPT
    ========================== -->

    <script
        src="script.js"
    ></script>


</body>

</html>
