<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MealMind</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>

<main class="app">

    <h1>🧠 MealMind</h1>

    <p>Scan your recipes. Plan your meals.</p>

    <!-- CAMERA BUTTON -->

    <input
        type="file"
        id="recipeImage"
        accept="image/*"
        capture="environment"
        hidden
    >

    <button id="scanButton">
        📸 Scan Recipe
    </button>

    <p id="status"></p>


    <!-- RECIPE SCANNER BOX -->

    <section>

        <h2>📖 Recipe Scanner</h2>

        <textarea
            id="recipeText"
            placeholder="Scan a recipe or type recipe text here..."
        ></textarea>

        <button id="saveRecipeButton">
            💾 Save Recipe
        </button>

    </section>


    <!-- GROCERY LIST -->

    <section>

        <h2>🛒 Grocery List</h2>

        <ul id="groceryList"></ul>

    </section>

</main>


<!-- HIDDEN OWNER LOGIN -->

<div
    id="ownerLogin"
    class="owner-login"
    hidden
>

    <h2>🔐 Owner Login</h2>

    <input
        type="password"
        id="ownerCode"
        placeholder="Owner code"
    >

    <button id="ownerButton">
        Login
    </button>

    <p id="ownerStatus"></p>

</div>


<!-- OWNER PANEL -->

<div id="ownerPanel" class="owner-panel" hidden>

    <div class="owner-app">

        <header class="owner-header">

            <div>
                <h1>🧠 MealMind</h1>
                <p>Owner Dashboard</p>
            </div>

            <span class="owner-badge">
                OWNER
            </span>

        </header>


        <section class="owner-section">

            <h2>📊 Dashboard</h2>

            <div class="owner-stats">

                <div class="stat-card">
                    <strong id="recipeCount">0</strong>
                    <span>Recipes</span>
                </div>

                <div class="stat-card">
                    <strong>0</strong>
                    <span>Users</span>
                </div>

            </div>

        </section>


        <section class="owner-section">

            <h2>📖 Saved Recipes</h2>

            <div id="savedRecipes"></div>

        </section>


        <section class="owner-section">

            <h2>🧠 MoonPlug</h2>

            <p>
                AI cooking assistant
            </p>

            <button id="moonplugButton">
                MoonPlug Settings
            </button>

        </section>


        <button id="closeOwner" class="close-owner">
            ← Back to MealMind
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
